<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>WebMCP Agent</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <div class="toolbar">
        <div class="connection">
          <span id="dot" class="dot"></span>
          <strong id="pageTitle" data-i18n="connecting"
            >Connecting to this tab…</strong
          >
          <button id="toolsButton" class="pill" data-i18n-tip="availableTools">
            0 tools
          </button>
        </div>
        <div class="actions">
          <button id="newSession" class="icon" data-i18n-title="newSession">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
          <button id="float" class="icon" data-i18n-title="popOut">
            <svg class="glyph-out" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 4h6v6M20 4l-8 8" />
              <path
                d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"
              />
            </svg>
            <svg class="glyph-dock" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M15 4v16" />
            </svg>
          </button>
          <button id="settings" class="icon" data-i18n-title="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="messages" aria-label="Conversation">
      <section id="welcome">
        <svg class="brand" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6.5 4h11A3 3 0 0 1 20.5 7v7a3 3 0 0 1-3 3H12l-4.5 3.5V17h-1a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"
          />
          <path d="M9.5 9v2.5M14.5 9v2.5" />
        </svg>
        <h1 data-i18n="welcomeTitle">Ask about this page</h1>
        <p data-i18n="welcomeBody"></p>
        <div id="skillSuggestions" class="suggestions"></div>
      </section>
    </main>
    <footer>
      <div id="runStatus" role="status" hidden></div>
      <div id="slashMenu" class="slash-menu" role="listbox" hidden></div>
      <div class="composer">
        <div id="attachments" class="attachments" hidden></div>
        <textarea
          id="prompt"
          rows="2"
          data-i18n-placeholder="placeholder"
          data-i18n-aria="placeholder"
        ></textarea>
        <div class="composer-bottom">
          <div class="composer-tools">
            <button
              id="addFile"
              class="icon"
              type="button"
              data-i18n-title="addFiles"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
                />
              </svg>
            </button>
            <button
              id="modelLabel"
              type="button"
              class="text-button"
              data-i18n="connectModel"
              hidden
            ></button>
          </div>
          <button id="send" class="send" data-i18n-title="send">
            <svg class="glyph-send" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
            <svg class="glyph-stop" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1.5" />
            </svg>
          </button>
        </div>
      </div>
      <input id="fileInput" type="file" multiple hidden />
    </footer>
    <dialog id="settingsDialog" aria-labelledby="settingsTitle">
      <div class="dialog-head">
        <div>
          <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
          <p data-i18n="settingsSubtitle"></p>
        </div>
        <button
          type="button"
          class="icon close"
          data-i18n-title="closeSettings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </div>
      <div class="tabs" role="tablist">
        <button
          id="tabModel"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="configForm"
          data-i18n="tabModel"
        ></button>
        <button
          id="tabSkills"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="paneSkills"
          data-i18n="tabSkills"
        ></button>
        <button
          id="tabDeveloper"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="paneDeveloper"
          data-i18n="tabDeveloper"
        ></button>
      </div>
      <form id="configForm" role="tabpanel">
        <section class="settings-section">
          <h3 data-i18n="modelConnection"></h3>
          <p class="section-description" data-i18n="modelConnectionHint"></p>
          <label for="baseUrl" data-i18n="baseUrl"></label>
          <input
            id="baseUrl"
            type="url"
            required
            placeholder="https://api.deepseek.com"
            spellcheck="false"
          />
          <label for="apiKey" data-i18n="apiKey"></label>
          <div class="key-row">
            <input
              id="apiKey"
              type="password"
              autocomplete="off"
              required
              data-i18n-placeholder="apiKeyPlaceholder"
              spellcheck="false"
            />
            <button
              id="showKey"
              type="button"
              class="secondary"
              data-i18n="show"
            ></button>
          </div>
          <label class="check">
            <input id="saveKey" type="checkbox" />
            <span>
              <span data-i18n="rememberKey"></span>
              <small data-i18n="rememberKeyHint"></small>
            </span>
          </label>
          <label for="model" data-i18n="modelName"></label>
          <input
            id="model"
            required
            placeholder="deepseek-flash"
            spellcheck="false"
          />
        </section>
        <section class="settings-section">
          <div class="section-heading">
            <h3 data-i18n="instructions"></h3>
            <button
              id="resetPrompt"
              type="button"
              class="text-button"
              data-i18n="resetDefault"
            ></button>
          </div>
          <label
            class="sr-only"
            for="systemPrompt"
            data-i18n="systemPrompt"
          ></label>
          <textarea id="systemPrompt" rows="6" spellcheck="false"></textarea>
          <p class="hint" data-i18n="instructionsHint"></p>
        </section>
        <div class="privacy-note">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3 5 6v6c0 4.5 3.2 7.4 7 9 3.8-1.6 7-4.5 7-9V6z" />
            <path d="m9 12 2 2 4-4" />
          </svg>
          <p data-i18n="privacyNote"></p>
        </div>
        <div id="testResult" role="status"></div>
        <div class="dialog-actions">
          <button
            id="testConnection"
            type="button"
            class="secondary"
            data-i18n="testConnection"
          ></button>
          <button
            class="primary"
            type="submit"
            data-i18n="saveChanges"
          ></button>
        </div>
      </form>
      <section id="paneSkills" role="tabpanel" hidden>
        <div id="skillList">
          <p class="hint" data-i18n="skillsHint"></p>
          <div id="skillItems" class="skill-items"></div>
          <p id="skillNote" class="hint" role="status"></p>
          <div class="dialog-actions">
            <button
              id="importSkill"
              type="button"
              class="secondary"
              data-i18n="importSkill"
            ></button>
            <button
              id="newSkill"
              type="button"
              class="primary"
              data-i18n="newSkill"
            ></button>
          </div>
          <input
            id="skillFile"
            type="file"
            accept=".md,text/markdown,text/plain"
            multiple
            hidden
          />
        </div>
        <div id="skillEditor" hidden>
          <label for="skillName" data-i18n="skillName"></label>
          <input id="skillName" spellcheck="false" maxlength="40" />
          <label for="skillDescription" data-i18n="skillDescription"></label>
          <input id="skillDescription" maxlength="200" />
          <p class="hint" data-i18n="skillDescriptionHint"></p>
          <label for="skillInstructions" data-i18n="skillInstructions"></label>
          <textarea
            id="skillInstructions"
            rows="10"
            maxlength="20000"
            spellcheck="false"
          ></textarea>
          <label class="check">
            <input id="skillAuto" type="checkbox" />
            <span data-i18n="skillAuto"></span>
          </label>
          <p id="skillError" class="hint error" role="alert"></p>
          <div class="dialog-actions">
            <button
              id="deleteSkill"
              type="button"
              class="text-button danger"
              data-i18n="delete"
            ></button>
            <button
              id="exportSkill"
              type="button"
              class="secondary"
              data-i18n="export"
            ></button>
            <button
              id="cancelSkill"
              type="button"
              class="secondary"
              data-i18n="cancel"
            ></button>
            <button
              id="saveSkill"
              type="button"
              class="primary"
              data-i18n="save"
            ></button>
          </div>
        </div>
      </section>
      <section id="paneDeveloper" role="tabpanel" hidden>
        <label class="check">
          <input id="inspectorEnabled" type="checkbox" />
          <span data-i18n="inspectorEnable"></span>
        </label>
        <p class="hint" data-i18n="inspectorEnableHint"></p>
        <div class="dialog-actions">
          <button
            id="openInspector"
            type="button"
            class="secondary"
            data-i18n="openInspector"
          ></button>
        </div>
      </section>
    </dialog>
    <dialog id="toolsDialog" aria-labelledby="toolsTitle">
      <div class="dialog-head">
        <div>
          <h2 id="toolsTitle" data-i18n="availableTools">Available tools</h2>
          <p id="toolsSubtitle"></p>
        </div>
        <div class="dialog-head-actions">
          <button
            id="inspect"
            type="button"
            class="text-button"
            data-i18n="inspect"
            hidden
          ></button>
          <button id="refresh" class="icon" data-i18n-title="refreshTools">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7" />
              <path d="M21 3v6h-6" />
            </svg>
          </button>
          <button class="icon close" data-i18n-title="closeTools">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m6 6 12 12M6 18 18 6" />
            </svg>
          </button>
        </div>
      </div>
      <div id="toolsList"></div>
    </dialog>
    <script type="module" src="panel.js"></script>
  </body>
</html>
